name: Notify Grok Bot
run-name: "notify-grok #${{ github.event.issue.number }} (${{ github.event.action }})"

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: read

jobs:
  notify-grok:
    name: notify-grok
    if: github.event.label.name == 'agent'
    concurrency:
      group: notify-grok-${{ github.event.issue.number }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Send issue event to Grok Bot webhook
        env:
          URL: ${{ secrets.GROK_WEBHOOK_URL }}
          AUTH: ${{ secrets.GROK_WEBHOOK_AUTH }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [ -z "$URL" ] || [ -z "$AUTH" ]; then
            echo "::notice::Skipping Grok webhook notification: GROK_WEBHOOK_URL or GROK_WEBHOOK_AUTH secret is not set."
            exit 0
          fi
          python3 scripts/validate_models.py
          IDEMPOTENCY_KEY="${{ github.repository }}#${{ github.event.issue.number }}"
          DELIVERY_ID="${{ github.event.issue.number }}-${RUN_ID}-${RUN_ATTEMPT}"
          MODELS_JSON="$(python3 -c "import yaml, json; print(json.dumps(yaml.safe_load(open('models.yml'))))")"
          PAYLOAD="$(jq --arg idempotency_key "$IDEMPOTENCY_KEY" \
             --arg delivery_id "$DELIVERY_ID" \
             --arg run_id "$RUN_ID" \
             --argjson models "$MODELS_JSON" \
             '.idempotency_key = $idempotency_key | .delivery_id = $delivery_id | .run_id = $run_id | .labels = [(.issue.labels // [])[].name] | .models = $models' \
             "$GITHUB_EVENT_PATH")"

          HTTP_RESPONSE=$(printf "%s" "$PAYLOAD" | curl -s -w "\n%{http_code}" -X POST "$URL" \
            -H "Authorization: $AUTH" \
            -H "Content-Type: application/json" \
            --data-binary @-)

          HTTP_BODY=$(printf "%s" "$HTTP_RESPONSE" | sed '$d')
          HTTP_STATUS=$(printf "%s" "$HTTP_RESPONSE" | tail -n 1)

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✓ Successfully dispatched issue event to Grok Bot (HTTP $HTTP_STATUS)"
          else
            echo "::warning::Grok Bot webhook returned HTTP $HTTP_STATUS: $HTTP_BODY"
            echo "Webhook dispatch did not succeed, but workflow will exit cleanly to avoid false CI failures."
          fi
